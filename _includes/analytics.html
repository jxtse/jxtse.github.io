{% assign analytics_id = site.google_analytics_id | default: '' | strip %}
{% if page.analytics != false and analytics_id != '' %}

<!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ analytics_id | uri_escape }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', {{ analytics_id | jsonify }});
</script>

{% endif %}
