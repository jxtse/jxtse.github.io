<link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/apple-touch-icon.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/images/favicon-16x16.png' | relative_url }}">
<link rel="manifest" href="{{ '/images/site.webmanifest' | relative_url }}">

<meta name="theme-color" content="#ffffff">

<!-- Inter 字体 - 提升排版质感 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- 学术图标和增强的强调色样式 -->
<link rel="stylesheet" href="{{ '/assets/css/academicons.css' | relative_url }}"/>
<link rel="stylesheet" href="{{ '/assets/css/accent-enhancements.css' | relative_url }}?v={{ site.time | date: '%s' }}"/>

<!-- GoatCounter analytics — cookie-free, privacy-friendly. Set goatcounter_code in _config.yml to enable. -->
{% if site.goatcounter_code %}
<script data-goatcounter="https://{{ site.goatcounter_code }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
{% endif %}

{% if page.math == true %}
<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/MathJax.js?config=TeX-MML-AM_CHTML" async></script>
{% endif %}

<!-- 强调色增强的JavaScript动效 -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  // 为重要链接添加强调色效果
  document.querySelectorAll('a[href*="pdf"], a[href*="github"], a[href*="arxiv"]').forEach(link => {
    link.classList.add('link-accent');
  });
});

// 动态添加装饰条
document.addEventListener('DOMContentLoaded', function() {
  const body = document.body;
  body.classList.add('accent-border-top');
});
</script>

<!-- end custom head snippets -->
