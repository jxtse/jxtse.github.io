<!-- Project page: reading progress bar + widescreen TOC rail with active-section highlight.
     Same personal signature as the blog reading page. -->
<div class="pp-progress" aria-hidden="true"></div>
<script>
(function () {
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // --- Reading progress -------------------------------------------------
  var bar = document.querySelector('.pp-progress');
  function updateProgress() {
    var doc = document.documentElement;
    var max = doc.scrollHeight - window.innerHeight;
    var p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
    if (bar) bar.style.transform = 'scaleX(' + p + ')';
  }
  window.addEventListener('scroll', updateProgress, { passive: true });
  window.addEventListener('resize', updateProgress);
  updateProgress();

  // --- TOC rail (only rendered; CSS shows it >=1280px) --------------------
  var titles = Array.prototype.slice.call(
    document.querySelectorAll('.project-section .section-title')
  );
  if (titles.length < 2) return;

  var toc = document.createElement('nav');
  toc.className = 'pp-toc';
  toc.setAttribute('aria-label', 'Contents');
  var label = document.createElement('div');
  label.className = 'pp-toc-label';
  label.textContent = 'Contents';
  toc.appendChild(label);

  var links = [];
  titles.forEach(function (h, i) {
    var slug = h.textContent.trim().toLowerCase()
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'section-' + i;
    h.id = slug;
    var a = document.createElement('a');
    a.href = '#' + slug;
    a.textContent = h.textContent.trim();
    a.addEventListener('click', function (e) {
      e.preventDefault();
      var y = h.getBoundingClientRect().top + window.scrollY - 90;
      window.scrollTo({ top: y, behavior: reduced ? 'auto' : 'smooth' });
      history.replaceState(null, '', '#' + slug);
    });
    toc.appendChild(a);
    links.push(a);
  });
  document.body.appendChild(toc);

  function updateActive() {
    var current = 0;
    for (var i = 0; i < titles.length; i++) {
      if (titles[i].getBoundingClientRect().top - 140 <= 0) current = i;
    }
    links.forEach(function (a, i) {
      a.classList.toggle('active', i === current);
    });
  }
  window.addEventListener('scroll', updateActive, { passive: true });
  updateActive();
})();
</script>
